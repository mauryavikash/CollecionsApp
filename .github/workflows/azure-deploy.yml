# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy vs Node.js app to Azure Web App - faa-collections-webappservice

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: npm ci, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !.next/cache/**

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT via OIDC
      contents: read # This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deploy-package

      - name: Validate deployment package is not empty
        run: |
          echo "Checking deploy package contents..."
          find ./deploy-package -type f | head -n 20
          FILE_COUNT=$(find ./deploy-package -type f | wc -l)
          echo "Total files in package: ${FILE_COUNT}"
          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "Deployment package is empty. Failing job to prevent blank App Service deploy."
            exit 1
          fi
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}       
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}       
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} 

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'faa-collections-webappservice'
          package: ./deploy-package
